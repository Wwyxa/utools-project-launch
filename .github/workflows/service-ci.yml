name: Project Launch CI

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plugin:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run plugin tests
        run: npm test

      - name: Run TypeScript check
        run: npm run lint

      - name: Check preload syntax
        run: find public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build plugin
        run: npm run build

  validate:
    name: Validate service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Check formatting
        run: |
          mapfile -t go_files < <(find . -type f -name '*.go' -print)
          if ((${#go_files[@]} == 0)); then
            echo "No Go files found."
            exit 1
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Cross-build and enforce executable size limit
        run: |
          release_dir=".release-ci"
          max_size_bytes=$((12 * 1024 * 1024))
          targets=(
            "windows/amd64:project-launch-service-windows-amd64.exe"
            "windows/arm64:project-launch-service-windows-arm64.exe"
            "linux/amd64:project-launch-service-linux-amd64"
            "linux/arm64:project-launch-service-linux-arm64"
            "darwin/amd64:project-launch-service-darwin-amd64"
            "darwin/arm64:project-launch-service-darwin-arm64"
          )

          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          for entry in "${targets[@]}"; do
            IFS=':' read -r target asset_name <<< "$entry"
            IFS='/' read -r goos goarch <<< "$target"
            output_path="$release_dir/$asset_name"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -buildvcs=false -ldflags="-s -w" \
                -o "$output_path" ./cmd/project-launch-service

            size_bytes="$(stat -c '%s' "$output_path")"
            printf '%-48s %12d bytes\n' "$asset_name" "$size_bytes"
            if ((size_bytes > max_size_bytes)); then
              echo "$asset_name exceeds the 12 MiB raw executable limit."
              exit 1
            fi
          done
