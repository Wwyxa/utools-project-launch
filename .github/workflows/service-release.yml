name: Release Project Launch Service

on:
  push:
    tags:
      - "service-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing service release tag (service-v*)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    name: Build and publish service release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          case "$tag" in
            service-v*) ;;
            *)
              echo "Release tags must follow the service-v* convention."
              exit 1
              ;;
          esac

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build release assets and verify checksums
        working-directory: service
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          release_dir=".release"
          max_size_bytes=$((12 * 1024 * 1024))
          assets=(
            "project-launch-service-windows-amd64.exe"
            "project-launch-service-windows-arm64.exe"
            "project-launch-service-linux-amd64"
            "project-launch-service-linux-arm64"
            "project-launch-service-darwin-amd64"
            "project-launch-service-darwin-arm64"
          )
          targets=(
            "windows/amd64"
            "windows/arm64"
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          rm -rf "$release_dir"
          mkdir -p "$release_dir"

          for index in "${!targets[@]}"; do
            IFS='/' read -r goos goarch <<< "${targets[$index]}"
            asset_name="${assets[$index]}"
            output_path="$release_dir/$asset_name"

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -buildvcs=false \
                -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
                -o "$output_path" ./cmd/project-launch-service

            size_bytes="$(stat -c '%s' "$output_path")"
            printf '%-48s %12d bytes\n' "$asset_name" "$size_bytes"
            if ((size_bytes > max_size_bytes)); then
              echo "$asset_name exceeds the 12 MiB raw executable limit."
              exit 1
            fi
          done

          (
            cd "$release_dir"
            sha256sum "${assets[@]}" > checksums.txt
            sha256sum --check checksums.txt
          )

      - name: Publish or update GitHub release
        working-directory: service
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          release_assets=(
            .release/project-launch-service-windows-amd64.exe
            .release/project-launch-service-windows-arm64.exe
            .release/project-launch-service-linux-amd64
            .release/project-launch-service-linux-arm64
            .release/project-launch-service-darwin-amd64
            .release/project-launch-service-darwin-arm64
            .release/checksums.txt
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
